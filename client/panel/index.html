<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Watchtower</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="bar">
    <button id="menuBtn" class="icon-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" data-i18n-title="panel.menu"></button>
    <span class="title">Watchtower</span>
  </header>

  <main class="actions">
    <button id="watchBtn" class="action" aria-pressed="false" disabled>
      <span class="glyph"></span><span class="label" id="watchLabel" data-i18n="panel.watch"></span>
    </button>
    <button id="syncBtn" class="action" disabled>
      <span class="glyph"></span><span class="label" data-i18n="panel.sync"></span>
    </button>
    <button id="foldersBtn" class="action">
      <span class="glyph"></span><span class="label" data-i18n="panel.folders"></span>
    </button>
  </main>

  <p id="info" class="info" role="status" aria-live="polite"></p>

  <div id="drop" class="drop" hidden><span data-i18n="panel.drop"></span></div>

  <div id="menu" class="menu" role="menu" hidden>
    <div id="menuVersion" class="menu-header" aria-disabled="true"></div>
    <button id="settingsItem" class="menu-item" role="menuitem" data-i18n="panel.settings"></button>
  </div>

  <script src="../shared/cep.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="panel.js"></script>
</body>
</html>
