<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settings</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="window">
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-general" aria-controls="panel-general" data-tab="general" data-i18n="settings.tab.general"></button>
      <button class="tab" role="tab" id="tab-allowed" aria-controls="panel-allowed" data-tab="allowed" data-i18n="settings.tab.allowed"></button>
      <button class="tab" role="tab" id="tab-ignored" aria-controls="panel-ignored" data-tab="ignored" data-i18n="settings.tab.ignored"></button>
    </nav>

    <section id="panel-general" class="panel" role="tabpanel" aria-labelledby="tab-general"></section>

    <section id="panel-allowed" class="panel" role="tabpanel" aria-labelledby="tab-allowed" hidden>
      <h2 class="list-title" data-i18n="settings.allowedTitle"></h2>
      <div class="list-tools">
        <input id="allowed-search" class="field search" type="search" data-i18n-placeholder="settings.search" autocomplete="off" spellcheck="false">
        <form class="add-form" data-kind="allowed">
          <input id="allowed-add" class="field" data-i18n-placeholder="settings.extPlaceholder" autocomplete="off" spellcheck="false">
          <button class="btn" type="submit" data-i18n="settings.add"></button>
        </form>
      </div>
      <ul id="allowed-list" class="list"></ul>
    </section>

    <section id="panel-ignored" class="panel" role="tabpanel" aria-labelledby="tab-ignored" hidden>
      <h2 class="list-title" data-i18n="settings.ignoredTitle"></h2>
      <p class="hint" data-i18n="settings.ignoredHint"></p>
      <div class="list-tools">
        <input id="ignored-search" class="field search" type="search" data-i18n-placeholder="settings.search" autocomplete="off" spellcheck="false">
        <form class="add-form" data-kind="ignored">
          <input id="ignored-add" class="field wide" data-i18n-placeholder="settings.ignorePlaceholder" autocomplete="off" spellcheck="false">
          <button class="btn" type="submit" data-i18n="settings.add"></button>
        </form>
      </div>
      <ul id="ignored-list" class="list"></ul>
    </section>

    <footer class="footer">
      <p id="status" class="status-line" role="status" aria-live="polite"></p>
      <button id="cancelBtn" class="btn" data-i18n="settings.cancel"></button>
      <button id="okBtn" class="btn primary" data-i18n="settings.ok"></button>
    </footer>
  </div>

  <script src="../shared/cep.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="settings.js"></script>
</body>
</html>
